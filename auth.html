<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexoChat — Вхід</title>
<script>
  (function(){
    const _f=window.fetch;
    window.fetch=function(u,o){o=o||{};o.headers=Object.assign({'bypass-tunnel-reminder':'true','ngrok-skip-browser-warning':'69420'},o.headers||{});return _f.call(this,u,o);};
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0c0a08;
  --card:#141210;
  --border:rgba(255,140,50,.14);
  --border2:rgba(255,140,50,.35);
  --orange:#ff8c32;
  --orange2:#ffb870;
  --accent:#ff6a00;
  --glow:rgba(255,120,40,.25);
  --text:#f5ede4;
  --muted:#9c8a78;
  --muted2:#b89d88;
  --red:#ff4f4f;
  --green:#4fdf8a;
  --heading:'Syne',sans-serif;
  --body:'Space Grotesk',sans-serif;
}
body{
  font-family:var(--body);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow:hidden;
}

/* ── BACKGROUND ─────────────────────────────────── */
.bg-orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;}
.orb-1{width:500px;height:500px;background:radial-gradient(circle,#ff6a00,transparent 70%);top:-150px;left:-150px;animation:drift1 12s ease-in-out infinite alternate;}
.orb-2{width:400px;height:400px;background:radial-gradient(circle,#ff8c32,transparent 70%);bottom:-100px;right:-100px;animation:drift2 15s ease-in-out infinite alternate;}
.orb-3{width:250px;height:250px;background:radial-gradient(circle,#ffb347,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);animation:pulse3 8s ease-in-out infinite;}
@keyframes drift1{from{transform:translate(0,0) rotate(0deg)}to{transform:translate(60px,40px) rotate(20deg)}}
@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-50px,-30px)}}
@keyframes pulse3{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.15}50%{transform:translate(-50%,-50%) scale(1.3);opacity:.25}}

.grid-lines{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,140,50,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,140,50,.04) 1px,transparent 1px);
  background-size:48px 48px;
}

/* ── CARD ────────────────────────────────────────── */
.box{
  position:relative;z-index:1;
  background:rgba(20,18,16,.85);
  border:1px solid var(--border2);
  border-radius:24px;
  padding:40px 36px 32px;
  width:100%;max-width:400px;
  box-shadow:0 0 60px rgba(255,100,0,.12),0 40px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,160,80,.08);
  backdrop-filter:blur(20px);
  animation:rise .5s cubic-bezier(.22,1,.36,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}

.box::before{
  content:'';position:absolute;inset:-1px;border-radius:25px;
  background:linear-gradient(135deg,rgba(255,140,50,.2),transparent 45%,rgba(255,100,0,.1) 100%);
  z-index:-1;pointer-events:none;
}

/* ── LOGO ────────────────────────────────────────── */
.logo{text-align:center;margin-bottom:32px;}
.logo-icon{
  width:68px;height:68px;border-radius:20px;
  background:linear-gradient(135deg,#ff6a00,#ffb347);
  display:flex;align-items:center;justify-content:center;
  font-size:1.8em;margin:0 auto 14px;
  box-shadow:0 0 0 4px rgba(255,140,50,.15),0 12px 32px rgba(255,100,0,.35);
  position:relative;overflow:hidden;
}
.logo-icon::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.2),transparent);
}
.logo-name{
  font-family:var(--heading);font-size:1.75em;font-weight:800;
  background:linear-gradient(135deg,#ff8c32,#ffda9e);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:-.03em;
}
.logo-sub{
  font-size:.72em;color:var(--muted);margin-top:4px;
  letter-spacing:.12em;text-transform:uppercase;font-weight:500;
}

/* ── LANGUAGE ────────────────────────────────────── */
.lang-row{
  display:flex;gap:6px;justify-content:center;margin-bottom:24px;
}
.lang-btn{
  padding:4px 10px;border-radius:20px;font-size:.7em;font-weight:600;
  border:1px solid var(--border);background:rgba(255,255,255,.03);
  color:var(--muted);cursor:pointer;transition:all .15s;letter-spacing:.04em;
}
.lang-btn.active,.lang-btn:hover{
  border-color:var(--orange);background:rgba(255,140,50,.1);color:var(--orange2);
}

/* ── TABS ─────────────────────────────────────────── */
.tabs{
  display:flex;margin-bottom:24px;
  background:rgba(0,0,0,.3);
  border:1px solid var(--border);
  border-radius:12px;overflow:hidden;
  padding:3px;gap:3px;
}
.tab-btn{
  flex:1;padding:10px;border:none;background:none;
  color:var(--muted);font-family:var(--body);font-size:.84em;font-weight:600;
  cursor:pointer;border-radius:9px;transition:all .2s;
}
.tab-btn.active{
  background:linear-gradient(135deg,rgba(255,110,0,.3),rgba(255,140,50,.15));
  color:var(--orange2);
  box-shadow:0 2px 8px rgba(255,100,0,.2);
}
.tab-btn:hover:not(.active){background:rgba(255,140,50,.06);color:var(--text);}

/* ── FIELDS ──────────────────────────────────────── */
.field{margin-bottom:14px;}
.field label{
  display:block;font-size:.67em;font-weight:600;
  color:var(--muted2);letter-spacing:.09em;text-transform:uppercase;
  margin-bottom:7px;
}
.field input{
  width:100%;padding:12px 15px;
  background:rgba(255,255,255,.04);
  border:1.5px solid rgba(255,140,50,.15);
  border-radius:12px;color:var(--text);
  font-size:.88em;font-family:var(--body);outline:none;
  transition:border .2s,box-shadow .2s,background .2s;
}
.field input::placeholder{color:var(--muted);}
.field input:focus{
  border-color:var(--orange);
  background:rgba(255,140,50,.06);
  box-shadow:0 0 0 3px rgba(255,140,50,.12);
}

/* ── DIVIDER ─────────────────────────────────────── */
.divider{
  display:flex;align-items:center;gap:10px;margin:18px 0;
}
.divider span{
  flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--border),transparent);
}
.divider em{font-size:.7em;color:var(--muted);font-style:normal;white-space:nowrap;}

/* ── TELEGRAM BTN ────────────────────────────────── */
.tg-btn{
  width:100%;padding:12px;display:flex;align-items:center;
  justify-content:center;gap:9px;
  background:rgba(32,160,220,.12);
  border:1.5px solid rgba(32,160,220,.25);
  border-radius:12px;color:#5bc8f5;
  font-size:.86em;font-weight:600;font-family:var(--body);
  cursor:pointer;transition:all .2s;margin-bottom:4px;
}
.tg-btn:hover{background:rgba(32,160,220,.2);border-color:rgba(32,160,220,.45);transform:translateY(-1px);}
.tg-ico{font-size:1.3em;}

/* ── SUBMIT BTN ──────────────────────────────────── */
.btn-submit{
  width:100%;padding:13px;margin-top:6px;
  background:linear-gradient(135deg,#ff6a00,#ff8c32,#ffb347);
  background-size:200% 200%;
  border:none;border-radius:12px;color:#fff;
  font-family:var(--heading);font-size:.95em;font-weight:700;
  cursor:pointer;letter-spacing:.04em;
  transition:all .25s;
  box-shadow:0 6px 24px rgba(255,100,0,.4),0 2px 8px rgba(0,0,0,.3);
  animation:gradshift 4s ease infinite;
}
@keyframes gradshift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(255,100,0,.5),0 4px 12px rgba(0,0,0,.4);}
.btn-submit:active{transform:translateY(0);}

/* ── ERROR ───────────────────────────────────────── */
.err{
  color:var(--red);font-size:.75em;margin-top:10px;display:none;
  background:rgba(255,79,79,.08);border:1px solid rgba(255,79,79,.2);
  border-radius:9px;padding:9px 12px;font-weight:500;
}
.err.show{display:block;}

/* ── LINKS ───────────────────────────────────────── */
.back{text-align:center;margin-top:20px;font-size:.78em;color:var(--muted);}
.back a{color:var(--orange2);text-decoration:none;font-weight:600;}
.back a:hover{text-decoration:underline;}
.forgot{text-align:right;margin-top:-8px;margin-bottom:12px;}
.forgot a{font-size:.72em;color:var(--muted);text-decoration:none;}
.forgot a:hover{color:var(--orange2);}

/* ── RECOVERY MODAL ──────────────────────────────── */
.modal-ov{
  position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.7);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-ov.open{display:flex;}
.modal-box{
  background:#181410;border:1px solid var(--border2);
  border-radius:20px;padding:28px 24px;width:100%;max-width:340px;
  animation:rise .3s cubic-bezier(.22,1,.36,1);
}
.modal-title{font-family:var(--heading);font-weight:700;font-size:1.1em;margin-bottom:16px;color:var(--orange2);}
.modal-close{
  float:right;background:none;border:none;color:var(--muted);
  font-size:1.2em;cursor:pointer;line-height:1;
}
.modal-close:hover{color:var(--text);}

/* ── LOADING SPINNER ─────────────────────────────── */
.spin{
  display:inline-block;width:16px;height:16px;
  border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;
  animation:spin .7s linear infinite;vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>
<div class="grid-lines"></div>

<div class="box">
  <div class="logo">
    <div class="logo-icon">💬</div>
    <div class="logo-name">NexoChat</div>
    <div class="logo-sub" id="logo-sub">Secure Messenger</div>
  </div>

  <div class="lang-row">
    <button class="lang-btn active" onclick="setLang('uk')">🇺🇦 UA</button>
    <button class="lang-btn" onclick="setLang('ru')">🇷🇺 RU</button>
    <button class="lang-btn" onclick="setLang('en')">🇬🇧 EN</button>
    <button class="lang-btn" onclick="setLang('pl')">🇵🇱 PL</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-login" onclick="switchTab('login')" data-i18n="login">Вхід</button>
    <button class="tab-btn" id="tab-register" onclick="switchTab('register')" data-i18n="register">Реєстрація</button>
  </div>

  <!-- LOGIN FORM -->
  <div id="form-login">
    <button class="tg-btn" onclick="loginTelegram()">
      <span class="tg-ico">✈️</span>
      <span data-i18n="tg_login">Увійти через Telegram</span>
    </button>
    <div class="divider"><span></span><em data-i18n="or">або</em><span></span></div>
    <div class="field">
      <label data-i18n="username">Ім'я користувача</label>
      <input id="l-user" autocomplete="username" placeholder="username">
    </div>
    <div class="field">
      <label data-i18n="password">Пароль</label>
      <input id="l-pass" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <div class="forgot"><a href="#" onclick="openRecovery(event)" data-i18n="forgot">Забули пароль?</a></div>
    <button class="btn-submit" onclick="doLogin()" data-i18n="login_btn">Увійти</button>
    <div class="err" id="l-err"></div>
  </div>

  <!-- REGISTER FORM -->
  <div id="form-register" style="display:none;">
    <button class="tg-btn" onclick="loginTelegram()">
      <span class="tg-ico">✈️</span>
      <span data-i18n="tg_register">Зареєструватися через Telegram</span>
    </button>
    <div class="divider"><span></span><em data-i18n="or">або</em><span></span></div>
    <div class="field">
      <label data-i18n="username">Ім'я користувача</label>
      <input id="r-user" autocomplete="username" placeholder="username">
    </div>
    <div class="field">
      <label data-i18n="display_name">Відображуване ім'я</label>
      <input id="r-display" placeholder="Твоє ім'я">
    </div>
    <div class="field">
      <label data-i18n="email">Email</label>
      <input id="r-email" type="email" autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="field">
      <label data-i18n="password">Пароль</label>
      <input id="r-pass" type="password" autocomplete="new-password" placeholder="••••••••">
    </div>
    <button class="btn-submit" onclick="doRegister()" data-i18n="register_btn">Створити акаунт</button>
    <div class="err" id="r-err"></div>
  </div>

  <div class="back">
    <a href="/" data-i18n="back_home">← На головну</a>
  </div>
</div>

<!-- RECOVERY MODAL -->
<div class="modal-ov" id="rec-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeRecovery()">✕</button>
    <div class="modal-title" data-i18n="recovery_title">Відновлення доступу</div>
    <p style="font-size:.8em;color:var(--muted);margin-bottom:16px;" data-i18n="recovery_sub">Виберіть спосіб відновлення пароля</p>
    <button class="tg-btn" onclick="recoverViaTelegram()" style="margin-bottom:12px;">
      <span class="tg-ico">✈️</span>
      <span data-i18n="recovery_tg">Через Telegram бот</span>
    </button>
    <div class="field">
      <label data-i18n="recovery_email">Email для відновлення</label>
      <input id="rec-email" type="email" placeholder="you@example.com">
    </div>
    <button class="btn-submit" onclick="sendRecoveryEmail()" data-i18n="recovery_send">Надіслати лист</button>
    <div class="err" id="rec-err" style="display:none;"></div>
  </div>
</div>

<script>
const I18N = {
  uk:{
    login:'Вхід', register:'Реєстрація', tg_login:'Увійти через Telegram',
    tg_register:'Зареєструватися через Telegram', or:'або', username:"Ім'я користувача",
    password:'Пароль', display_name:'Відображуване ім\'я', email:'Email', forgot:'Забули пароль?',
    login_btn:'Увійти', register_btn:'Створити акаунт', back_home:'← На головну',
    recovery_title:'Відновлення доступу', recovery_sub:'Виберіть спосіб відновлення пароля',
    recovery_tg:'Через Telegram бот', recovery_email:'Email для відновлення',
    recovery_send:'Надіслати лист', logo_sub:'Безпечний месенджер',
    err_login:'Невірний логін або пароль', err_register:'Помилка реєстрації',
  },
  ru:{
    login:'Вход', register:'Регистрация', tg_login:'Войти через Telegram',
    tg_register:'Зарегистрироваться через Telegram', or:'или', username:'Имя пользователя',
    password:'Пароль', display_name:'Отображаемое имя', email:'Email', forgot:'Забыли пароль?',
    login_btn:'Войти', register_btn:'Создать аккаунт', back_home:'← На главную',
    recovery_title:'Восстановление доступа', recovery_sub:'Выберите способ восстановления пароля',
    recovery_tg:'Через Telegram бот', recovery_email:'Email для восстановления',
    recovery_send:'Отправить письмо', logo_sub:'Безопасный мессенджер',
    err_login:'Неверный логин или пароль', err_register:'Ошибка регистрации',
  },
  en:{
    login:'Login', register:'Register', tg_login:'Login with Telegram',
    tg_register:'Register with Telegram', or:'or', username:'Username',
    password:'Password', display_name:'Display name', email:'Email', forgot:'Forgot password?',
    login_btn:'Sign In', register_btn:'Create account', back_home:'← Back to home',
    recovery_title:'Account recovery', recovery_sub:'Choose a recovery method',
    recovery_tg:'Via Telegram bot', recovery_email:'Recovery email',
    recovery_send:'Send email', logo_sub:'Secure Messenger',
    err_login:'Wrong username or password', err_register:'Registration error',
  },
  pl:{
    login:'Logowanie', register:'Rejestracja', tg_login:'Zaloguj przez Telegram',
    tg_register:'Zarejestruj przez Telegram', or:'lub', username:'Nazwa użytkownika',
    password:'Hasło', display_name:'Wyświetlana nazwa', email:'Email', forgot:'Zapomniałeś hasła?',
    login_btn:'Zaloguj się', register_btn:'Utwórz konto', back_home:'← Powrót',
    recovery_title:'Odzyskiwanie dostępu', recovery_sub:'Wybierz metodę odzyskiwania',
    recovery_tg:'Przez bota Telegram', recovery_email:'Email do odzyskiwania',
    recovery_send:'Wyślij email', logo_sub:'Bezpieczny komunikator',
    err_login:'Błędny login lub hasło', err_register:'Błąd rejestracji',
  }
};

let LANG = localStorage.getItem('nexo_lang') || 'uk';

function setLang(l) {
  LANG = l;
  localStorage.setItem('nexo_lang', l);
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  applyLang();
}

function applyLang() {
  const t = I18N[LANG];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    if (t[k]) el.textContent = t[k];
  });
  document.getElementById('logo-sub').textContent = t.logo_sub;
}

function switchTab(tab) {
  document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
}

async function doLogin() {
  const u = document.getElementById('l-user').value.trim();
  const p = document.getElementById('l-pass').value;
  const btn = document.querySelector('#form-login .btn-submit');
  btn.innerHTML = '<span class="spin"></span>';
  try {
    const r = await fetch('/web/api/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({username: u, password: p})
    });
    const d = await r.json();
    if (d.ok) {
      localStorage.setItem('web_token', d.token);
      window.location = d.is_admin ? '/' : '/chat';
    } else {
      showErr('l-err', d.error || I18N[LANG].err_login);
    }
  } catch(e) { showErr('l-err', 'Network error'); }
  btn.textContent = I18N[LANG].login_btn;
}

async function doRegister() {
  const u = document.getElementById('r-user').value.trim();
  const dn = document.getElementById('r-display').value.trim();
  const em = document.getElementById('r-email').value.trim();
  const p = document.getElementById('r-pass').value;
  const btn = document.querySelector('#form-register .btn-submit');
  btn.innerHTML = '<span class="spin"></span>';
  try {
    const r = await fetch('/web/api/register', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({username: u, display: dn, email: em, password: p})
    });
    const d = await r.json();
    if (d.ok) {
      localStorage.setItem('web_token', d.token);
      window.location = '/chat';
    } else {
      showErr('r-err', d.error || I18N[LANG].err_register);
    }
  } catch(e) { showErr('r-err', 'Network error'); }
  btn.textContent = I18N[LANG].register_btn;
}

function showErr(id, msg) {
  const e = document.getElementById(id);
  e.textContent = msg;
  e.classList.add('show');
  e.style.display = 'block';
}

function loginTelegram() {
  window.open('/auth/telegram', '_blank', 'width=480,height=640');
}

function openRecovery(e) { e.preventDefault(); document.getElementById('rec-modal').classList.add('open'); }
function closeRecovery() { document.getElementById('rec-modal').classList.remove('open'); }

function recoverViaTelegram() {
  window.open('/auth/telegram/recovery', '_blank', 'width=480,height=640');
}

async function sendRecoveryEmail() {
  const email = document.getElementById('rec-email').value.trim();
  if (!email) return;
  try {
    const r = await fetch('/web/api/recovery/email', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email})
    });
    const d = await r.json();
    if (d.ok) { closeRecovery(); alert('Email надіслано!'); }
    else showErr('rec-err', d.error || 'Помилка');
  } catch(e) { showErr('rec-err', 'Network error'); }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    document.getElementById('tab-login').classList.contains('active') ? doLogin() : doRegister();
  }
});

// Auto-redirect if token exists
const tok = localStorage.getItem('web_token');
if (tok) {
  fetch('/web/api/me', {headers: {'X-Web-Token': tok}})
    .then(r => r.json())
    .then(d => { if (d.logged_in) window.location = '/chat'; })
    .catch(() => {});
}

// Apply initial language
applyLang();

// Set active lang button
document.querySelectorAll('.lang-btn').forEach(b => {
  if (b.textContent.includes(LANG.toUpperCase()) || 
      (LANG === 'uk' && b.textContent.includes('UA')) ||
      (LANG === 'ru' && b.textContent.includes('RU')) ||
      (LANG === 'en' && b.textContent.includes('EN')) ||
      (LANG === 'pl' && b.textContent.includes('PL'))) {
    b.classList.add('active');
  } else { b.classList.remove('active'); }
});
</script>
</body>
</html>
