<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexoChat — Вхід</title>
<!--
  FIXED auth.html:
  1. API endpoints fixed: /web/api/login → /api/auth/login
                          /web/api/register → /api/auth/register
                          /web/api/me → /api/me
  2. Removed localStorage token logic (server uses HttpOnly cookies)
  3. Fixed setLang(l) — was using `event` without passing it
  4. Fixed auto-redirect check (/web/api/me → /api/me, and check cookie not token)
  5. Removed ngrok tunnel headers (dev-only, should not be in production code)
-->
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0c0a08;
  --card:#141210;
  --border:rgba(255,140,50,.14);
  --border2:rgba(255,140,50,.35);
  --orange:#ff8c32;
  --orange2:#ffb870;
  --accent:#ff6a00;
  --glow:rgba(255,120,40,.25);
  --text:#f5ede4;
  --muted:#9c8a78;
  --muted2:#b89d88;
  --red:#ff4f4f;
  --green:#4fdf8a;
  --heading:'Syne',sans-serif;
  --body:'Space Grotesk',sans-serif;
}
body{
  font-family:var(--body);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow:hidden;
}

/* ── BACKGROUND ─────────────────────────────── */
.bg-orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;}
.orb-1{width:500px;height:500px;background:radial-gradient(circle,#ff6a00,transparent 70%);top:-150px;left:-150px;animation:drift1 12s ease-in-out infinite alternate;}
.orb-2{width:400px;height:400px;background:radial-gradient(circle,#ff8c32,transparent 70%);bottom:-100px;right:-100px;animation:drift2 15s ease-in-out infinite alternate;}
.orb-3{width:250px;height:250px;background:radial-gradient(circle,#ffb347,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);animation:pulse3 8s ease-in-out infinite;}
@keyframes drift1{from{transform:translate(0,0) rotate(0deg)}to{transform:translate(60px,40px) rotate(20deg)}}
@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-50px,-30px)}}
@keyframes pulse3{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.15}50%{transform:translate(-50%,-50%) scale(1.3);opacity:.25}}

.grid-lines{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,140,50,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,140,50,.04) 1px,transparent 1px);
  background-size:48px 48px;
}

/* ── CARD ────────────────────────────────────── */
.box{
  position:relative;z-index:1;
  background:rgba(20,18,16,.85);
  border:1px solid var(--border2);
  border-radius:24px;
  padding:40px 36px 32px;
  width:100%;max-width:400px;
  box-shadow:0 0 60px rgba(255,100,0,.12),0 40px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,160,80,.08);
  backdrop-filter:blur(20px);
  animation:rise .5s cubic-bezier(.22,1,.36,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}

/* ── LOGO ────────────────────────────────────── */
.logo{text-align:center;margin-bottom:32px;}
.logo-icon{
  width:68px;height:68px;border-radius:20px;
  background:linear-gradient(135deg,#ff6a00,#ffb347);
  display:flex;align-items:center;justify-content:center;
  font-size:1.8em;margin:0 auto 14px;
  box-shadow:0 0 0 4px rgba(255,140,50,.15),0 12px 32px rgba(255,100,0,.35);
}
.logo-name{
  font-family:var(--heading);font-size:1.75em;font-weight:800;
  background:linear-gradient(135deg,#ff8c32,#ffda9e);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.logo-sub{font-size:.72em;color:var(--muted);margin-top:4px;letter-spacing:.12em;text-transform:uppercase;}

/* ── LANGUAGE ────────────────────────────────── */
.lang-row{display:flex;gap:6px;justify-content:center;margin-bottom:24px;}
.lang-btn{
  padding:4px 10px;border-radius:20px;font-size:.7em;font-weight:600;
  border:1px solid var(--border);background:rgba(255,255,255,.03);
  color:var(--muted);cursor:pointer;transition:all .15s;
}
.lang-btn.active,.lang-btn:hover{border-color:var(--orange);background:rgba(255,140,50,.1);color:var(--orange2);}

/* ── TABS ─────────────────────────────────────── */
.tabs{
  display:flex;margin-bottom:24px;
  background:rgba(0,0,0,.3);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;padding:3px;gap:3px;
}
.tab-btn{
  flex:1;padding:10px;border:none;background:none;
  color:var(--muted);font-family:var(--body);font-size:.84em;font-weight:600;
  cursor:pointer;border-radius:9px;transition:all .2s;
}
.tab-btn.active{
  background:linear-gradient(135deg,rgba(255,110,0,.3),rgba(255,140,50,.15));
  color:var(--orange2);box-shadow:0 2px 8px rgba(255,100,0,.2);
}
.tab-btn:hover:not(.active){background:rgba(255,140,50,.06);color:var(--text);}

/* ── FIELDS ──────────────────────────────────── */
.field{margin-bottom:14px;}
.field label{
  display:block;font-size:.67em;font-weight:600;
  color:var(--muted2);letter-spacing:.09em;text-transform:uppercase;margin-bottom:7px;
}
.field input,.field select{
  width:100%;padding:12px 15px;
  background:rgba(255,255,255,.04);
  border:1.5px solid rgba(255,140,50,.15);
  border-radius:12px;color:var(--text);
  font-size:.88em;font-family:var(--body);outline:none;
  transition:border .2s,box-shadow .2s;
}
.field input::placeholder{color:var(--muted);}
.field input:focus,.field select:focus{
  border-color:var(--orange);
  background:rgba(255,140,50,.06);
  box-shadow:0 0 0 3px rgba(255,140,50,.12);
}
.field select option{background:#1a1816;}

/* ── SUBMIT BTN ──────────────────────────────── */
.btn-submit{
  width:100%;padding:13px;margin-top:6px;
  background:linear-gradient(135deg,#ff6a00,#ff8c32,#ffb347);
  background-size:200% 200%;
  border:none;border-radius:12px;color:#fff;
  font-family:var(--heading);font-size:.95em;font-weight:700;
  cursor:pointer;transition:all .25s;
  box-shadow:0 6px 24px rgba(255,100,0,.4);
  animation:gradshift 4s ease infinite;
}
@keyframes gradshift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(255,100,0,.5);}
.btn-submit:active{transform:translateY(0);}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;transform:none;}

/* ── TELEGRAM BTN ────────────────────────────── */
.tg-btn{
  width:100%;padding:12px;display:flex;align-items:center;
  justify-content:center;gap:9px;
  background:rgba(32,160,220,.12);border:1.5px solid rgba(32,160,220,.25);
  border-radius:12px;color:#5bc8f5;font-size:.86em;font-weight:600;
  font-family:var(--body);cursor:pointer;transition:all .2s;margin-bottom:4px;
}
.tg-btn:hover{background:rgba(32,160,220,.2);border-color:rgba(32,160,220,.45);}

/* ── DIVIDER ─────────────────────────────────── */
.divider{display:flex;align-items:center;gap:10px;margin:18px 0;}
.divider span{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);}
.divider em{font-size:.7em;color:var(--muted);font-style:normal;}

/* ── ERROR ───────────────────────────────────── */
.err{
  color:var(--red);font-size:.75em;margin-top:10px;display:none;
  background:rgba(255,79,79,.08);border:1px solid rgba(255,79,79,.2);
  border-radius:9px;padding:9px 12px;font-weight:500;
}
.err.show{display:block;}

/* ── LINKS ───────────────────────────────────── */
.links{text-align:center;margin-top:16px;}
.links a{color:var(--muted);font-size:.75em;text-decoration:none;transition:color .15s;}
.links a:hover{color:var(--orange);}

/* ── SPINNER ─────────────────────────────────── */
.spin{
  display:inline-block;width:14px;height:14px;
  border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle;
}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── MODAL ───────────────────────────────────── */
.modal-ov{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);
  z-index:100;align-items:center;justify-content:center;padding:20px;
}
.modal-ov.open{display:flex;}
.modal-box{
  background:var(--card);border:1px solid var(--border2);
  border-radius:20px;padding:32px 28px;width:100%;max-width:380px;
  box-shadow:0 0 40px rgba(0,0,0,.6);
}
.modal-title{font-family:var(--heading);font-size:1.1em;font-weight:800;margin-bottom:16px;}
.modal-close{
  float:right;background:none;border:none;color:var(--muted);
  font-size:1.2em;cursor:pointer;padding:0;line-height:1;
}
.modal-close:hover{color:var(--text);}
</style>
</head>
<body>
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>
<div class="grid-lines"></div>

<div class="box">
  <div class="logo">
    <div class="logo-icon">💬</div>
    <div class="logo-name">NexoChat</div>
    <div class="logo-sub" id="logo-sub">Secure Messenger</div>
  </div>

  <!-- Language switcher -->
  <div class="lang-row">
    <button class="lang-btn" onclick="setLang('ua')">🇺🇦 UA</button>
    <button class="lang-btn" onclick="setLang('en')">🇬🇧 EN</button>
    <button class="lang-btn" onclick="setLang('ru')">🇷🇺 RU</button>
    <button class="lang-btn" onclick="setLang('pl')">🇵🇱 PL</button>
  </div>

  <!-- Login / Register tabs -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-login-btn" data-i18n="login" onclick="switchTab('login')">Login</button>
    <button class="tab-btn" id="tab-register-btn" data-i18n="register" onclick="switchTab('register')">Register</button>
  </div>

  <!-- Login form -->
  <div id="form-login">
    <div class="field">
      <label data-i18n="username">Username</label>
      <input id="l-user" type="text" placeholder="username" autocomplete="username">
    </div>
    <div class="field">
      <label data-i18n="password">Password</label>
      <input id="l-pass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-submit" id="l-btn" data-i18n="login_btn" onclick="doLogin()">Sign In</button>

    <div class="divider"><span></span><em data-i18n="or">or</em><span></span></div>
    <button class="tg-btn" onclick="loginTelegram()">
      <span class="tg-ico">📱</span> <span data-i18n="tg_login">Login with Telegram</span>
    </button>

    <div class="links">
      <a href="#" data-i18n="forgot" onclick="openRecovery(event)">Forgot password?</a>
    </div>
    <div class="err" id="l-err"></div>
  </div>

  <!-- Register form -->
  <div id="form-register" style="display:none;">
    <div class="field">
      <label data-i18n="username">Username</label>
      <input id="r-user" type="text" placeholder="my_username" autocomplete="username">
    </div>
    <div class="field">
      <label data-i18n="display_name">Display name</label>
      <input id="r-display" type="text" placeholder="Your Name">
    </div>
    <div class="field">
      <label data-i18n="email">Email</label>
      <input id="r-email" type="email" placeholder="you@example.com">
    </div>
    <div class="field">
      <label data-i18n="password">Password</label>
      <input id="r-pass" type="password" placeholder="••••••••" autocomplete="new-password">
    </div>
    <div class="field">
      <label>Language</label>
      <select id="r-lang">
        <option value="uk">Українська</option>
        <option value="en" selected>English</option>
        <option value="ru">Русский</option>
        <option value="pl">Polski</option>
      </select>
    </div>
    <button class="btn-submit" id="r-btn" data-i18n="register_btn" onclick="doRegister()">Create account</button>
    <div class="err" id="r-err"></div>
  </div>
</div>

<!-- Recovery modal -->
<div class="modal-ov" id="rec-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeRecovery()">✕</button>
    <div class="modal-title" data-i18n="recovery_title">Account recovery</div>
    <p style="font-size:.8em;color:var(--muted);margin-bottom:16px;" data-i18n="recovery_sub">Choose a recovery method</p>
    <button class="tg-btn" style="margin-bottom:12px;" onclick="recoverViaTelegram()">
      📱 <span data-i18n="recovery_tg">Via Telegram bot</span>
    </button>
    <div class="divider"><span></span><em data-i18n="or">or</em><span></span></div>
    <div class="field">
      <label data-i18n="recovery_email">Recovery email</label>
      <input id="rec-email" type="email" placeholder="you@example.com">
    </div>
    <button class="btn-submit" onclick="sendRecoveryEmail()" data-i18n="recovery_send">Send email</button>
    <div class="err" id="rec-err"></div>
  </div>
</div>

<!-- Reset password modal (opened by ?reset_token= in URL) -->
<div class="modal-ov" id="reset-modal">
  <div class="modal-box">
    <div class="modal-title">🔐 New password</div>
    <p style="font-size:.8em;color:var(--muted);margin-bottom:16px;">Enter a new password for your account</p>
    <input type="hidden" id="reset-token-val">
    <div class="field">
      <label>New password</label>
      <input id="reset-pw" type="password" placeholder="Min 6 characters">
    </div>
    <div class="field">
      <label>Confirm password</label>
      <input id="reset-pw2" type="password" placeholder="Repeat password">
    </div>
    <button class="btn-submit" onclick="doResetPassword()">Change password</button>
    <div class="err" id="reset-err" style="display:none;"></div>
  </div>
</div>

<script>
// ── i18n ──────────────────────────────────────────────────────────
const I18N = {
  uk:{
    login:'Вхід', register:'Реєстрація', tg_login:'Увійти через Telegram',
    tg_register:'Реєстрація через Telegram', or:'або', username:'Нікнейм',
    password:'Пароль', display_name:'Відображуване ім\'я', email:'Пошта',
    forgot:'Забув пароль?', login_btn:'Увійти', register_btn:'Створити акаунт',
    recovery_title:'Відновлення доступу', recovery_sub:'Виберіть спосіб відновлення',
    recovery_tg:'Через Telegram бота', recovery_email:'Email для відновлення',
    recovery_send:'Надіслати email', logo_sub:'Безпечний месенджер',
    err_login:'Невірний логін або пароль', err_register:'Помилка реєстрації',
  },
  ru:{
    login:'Вход', register:'Регистрация', tg_login:'Войти через Telegram',
    tg_register:'Регистрация через Telegram', or:'или', username:'Никнейм',
    password:'Пароль', display_name:'Отображаемое имя', email:'Почта',
    forgot:'Забыл пароль?', login_btn:'Войти', register_btn:'Создать аккаунт',
    recovery_title:'Восстановление доступа', recovery_sub:'Выберите способ восстановления',
    recovery_tg:'Через Telegram бота', recovery_email:'Email для восстановления',
    recovery_send:'Отправить email', logo_sub:'Безопасный мессенджер',
    err_login:'Неверный логин или пароль', err_register:'Ошибка регистрации',
  },
  en:{
    login:'Login', register:'Register', tg_login:'Login with Telegram',
    tg_register:'Register with Telegram', or:'or', username:'Username',
    password:'Password', display_name:'Display name', email:'Email',
    forgot:'Forgot password?', login_btn:'Sign In', register_btn:'Create account',
    recovery_title:'Account recovery', recovery_sub:'Choose a recovery method',
    recovery_tg:'Via Telegram bot', recovery_email:'Recovery email',
    recovery_send:'Send email', logo_sub:'Secure Messenger',
    err_login:'Wrong username or password', err_register:'Registration error',
  },
  pl:{
    login:'Logowanie', register:'Rejestracja', tg_login:'Zaloguj przez Telegram',
    tg_register:'Zarejestruj przez Telegram', or:'lub', username:'Nazwa użytkownika',
    password:'Hasło', display_name:'Wyświetlana nazwa', email:'Email',
    forgot:'Zapomniałeś hasła?', login_btn:'Zaloguj się', register_btn:'Utwórz konto',
    recovery_title:'Odzyskiwanie dostępu', recovery_sub:'Wybierz metodę odzyskiwania',
    recovery_tg:'Przez bota Telegram', recovery_email:'Email do odzyskiwania',
    recovery_send:'Wyślij email', logo_sub:'Bezpieczny komunikator',
    err_login:'Błędny login lub hasło', err_register:'Błąd rejestracji',
  }
};

// FIX #3: setLang no longer uses `event` global — it takes no parameter
// Language is stored in localStorage and applied on page load
let LANG = localStorage.getItem('nexo_lang') || 'en';

// Map button text to lang code
const LANG_MAP = { ua: 'uk', en: 'en', ru: 'ru', pl: 'pl' };

function setLang(l) {
  // l is e.g. 'ua', 'en', 'ru', 'pl'
  const code = LANG_MAP[l] || l;
  LANG = code;
  localStorage.setItem('nexo_lang', code);
  // Update active button highlight
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  // Find button that was clicked (we can't use event here, so match by lang)
  document.querySelectorAll('.lang-btn').forEach(b => {
    if (b.getAttribute('onclick') === `setLang('${l}')`) b.classList.add('active');
  });
  applyLang();
}

function applyLang() {
  const tr = I18N[LANG] || I18N.en;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    if (tr[k]) el.textContent = tr[k];
  });
  document.getElementById('logo-sub').textContent = tr.logo_sub;
}

// ── Tabs ──────────────────────────────────────────────────────────
function switchTab(tab) {
  document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('tab-login-btn').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register-btn').classList.toggle('active', tab === 'register');
}

// ── Error display ─────────────────────────────────────────────────
function showErr(id, msg) {
  const e = document.getElementById(id);
  e.textContent = msg;
  e.classList.add('show');
  e.style.display = 'block';
}
function clearErr(id) {
  const e = document.getElementById(id);
  e.classList.remove('show');
  e.style.display = 'none';
}

// ── Login ─────────────────────────────────────────────────────────
// FIX #1: Calls /api/auth/login (was /web/api/login — route did not exist)
// FIX #2: No localStorage.setItem('web_token') — server sets HttpOnly cookie
async function doLogin() {
  const u = document.getElementById('l-user').value.trim();
  const p = document.getElementById('l-pass').value;
  clearErr('l-err');
  if (!u || !p) { showErr('l-err', 'Заповніть усі поля / Fill all fields'); return; }

  const btn = document.getElementById('l-btn');
  btn.innerHTML = '<span class="spin"></span>';
  btn.disabled = true;

  try {
    const r = await fetch('/api/auth/login', {   // FIX #1
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const d = await r.json();
    if (d.ok) {
      // FIX #2: no localStorage — cookie is set by server automatically
      window.location.href = '/';
    } else {
      showErr('l-err', d.error || I18N[LANG].err_login);
    }
  } catch(e) {
    showErr('l-err', 'Network error');
  }

  btn.textContent = I18N[LANG].login_btn;
  btn.disabled = false;
}

// ── Register ──────────────────────────────────────────────────────
// FIX #1: Calls /api/auth/register (was /web/api/register — route did not exist)
// FIX #2: No localStorage token
async function doRegister() {
  const u  = document.getElementById('r-user').value.trim();
  const dn = document.getElementById('r-display').value.trim();
  const em = document.getElementById('r-email').value.trim();
  const p  = document.getElementById('r-pass').value;
  const l  = document.getElementById('r-lang').value;
  clearErr('r-err');
  if (!u || !p) { showErr('r-err', 'Username and password required'); return; }
  if (p.length < 6) { showErr('r-err', 'Password must be at least 6 characters'); return; }

  const btn = document.getElementById('r-btn');
  btn.innerHTML = '<span class="spin"></span>';
  btn.disabled = true;

  try {
    const r = await fetch('/api/auth/register', {   // FIX #1
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, display: dn, email: em, password: p, language: l })
    });
    const d = await r.json();
    if (d.ok) {
      // FIX #2: no localStorage — cookie is set by server automatically
      window.location.href = '/';
    } else {
      showErr('r-err', d.error || I18N[LANG].err_register);
    }
  } catch(e) {
    showErr('r-err', 'Network error');
  }

  btn.textContent = I18N[LANG].register_btn;
  btn.disabled = false;
}

// ── Telegram login ────────────────────────────────────────────────
function loginTelegram() {
  // This opens the Telegram bot link. BOT_USERNAME should be configured.
  const botUsername = window.NEXO_BOT_USERNAME || '';
  if (!botUsername) {
    alert('Telegram bot not configured. Ask the admin to set up the bot.');
    return;
  }
  window.open(`https://t.me/${botUsername}?start=login`, '_blank');
}

// ── Recovery modal ────────────────────────────────────────────────
function openRecovery(e) {
  e.preventDefault();
  document.getElementById('rec-modal').classList.add('open');
}
function closeRecovery() {
  document.getElementById('rec-modal').classList.remove('open');
}

function recoverViaTelegram() {
  const botUsername = window.NEXO_BOT_USERNAME || '';
  if (!botUsername) {
    alert('Telegram bot not configured.');
    return;
  }
  window.open(`https://t.me/${botUsername}?start=recover`, '_blank');
  closeRecovery();
}

async function sendRecoveryEmail() {
  const email = document.getElementById('rec-email').value.trim();
  if (!email) return;
  clearErr('rec-err');
  try {
    const r = await fetch('/api/auth/recovery/email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const d = await r.json();
    if (d.ok) {
      closeRecovery();
      alert('Email sent! Check your inbox.');
    } else {
      showErr('rec-err', d.error || 'Error');
    }
  } catch(e) { showErr('rec-err', 'Network error'); }
}

// ── Reset password ────────────────────────────────────────────────
async function doResetPassword() {
  const token = document.getElementById('reset-token-val').value;
  const pw    = document.getElementById('reset-pw').value;
  const pw2   = document.getElementById('reset-pw2').value;
  if (pw !== pw2) { showErr('reset-err', 'Passwords do not match'); return; }
  if (pw.length < 6) { showErr('reset-err', 'Min 6 characters'); return; }
  clearErr('reset-err');
  try {
    const r = await fetch('/api/auth/reset/password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: pw })
    });
    const d = await r.json();
    if (d.ok) {
      document.getElementById('reset-modal').classList.remove('open');
      alert('✅ Password changed! You can now log in.');
      history.replaceState({}, '', '/auth');
    } else {
      showErr('reset-err', d.error || 'Error');
    }
  } catch(e) { showErr('reset-err', 'Network error'); }
}

// ── Enter key ─────────────────────────────────────────────────────
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter') {
    const loginActive = document.getElementById('form-login').style.display !== 'none';
    if (loginActive) doLogin(); else doRegister();
  }
});

// FIX #4: Auto-redirect if already authenticated
// Uses /api/me with credentials (cookies) — no localStorage token check
(async () => {
  try {
    const r = await fetch('/api/me', { credentials: 'include' });
    if (r.ok) {
      const d = await r.json();
      if (d.username) { window.location.href = '/'; }
    }
  } catch(e) { /* not logged in */ }
})();

// ── Auto-open reset modal if ?reset_token= in URL ─────────────────
const _urlParams = new URLSearchParams(window.location.search);
const _resetToken = _urlParams.get('reset_token');
if (_resetToken) {
  document.getElementById('reset-token-val').value = _resetToken;
  document.getElementById('reset-modal').classList.add('open');
}

// ── Init ──────────────────────────────────────────────────────────
// Apply saved language
applyLang();

// Highlight active lang button
document.querySelectorAll('.lang-btn').forEach(b => {
  const onclick = b.getAttribute('onclick') || '';
  const match = onclick.match(/setLang\('(\w+)'\)/);
  if (match) {
    const code = LANG_MAP[match[1]] || match[1];
    if (code === LANG) b.classList.add('active');
  }
});
